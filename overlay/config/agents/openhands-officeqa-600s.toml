# 诊断用配置：与 openhands-officeqa.toml 相同，仅把智能体总时限放宽到 600 秒。
# 正式条件仍是 300 秒；这份配置只用于判断超时是否仅由预算造成，不用于跨 harness 比较。
[model]
model = "deepseek/deepseek-flash"
base_url = "https://example.invalid/v1"
api_key_env = "DEEPSEEK_API_KEY"
timeout = 120
num_retries = 0

[agent]
runner = "harness.openhands.runner:execute"
recorder = "agent_session_analyzer:OpenHandsRecorder"
cost_tracking = true
max_iterations = 100
tool_timeout_sec = 120
max_output_chars = 20000
tools = ["terminal", "read_file"]
timeout_sec = 600
